services:
  - type: web
    name: enj0y-shop-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: cd .. && flask --app backend.run db upgrade && gunicorn backend.run:app
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SESSION_TYPE
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SESSION_COOKIE_SAMESITE
        sync: false
      - key: SESSION_COOKIE_SECURE
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: MAILGUN_API_KEY
        sync: false
      - key: MAILGUN_DOMAIN
        sync: false
      - key: MAILGUN_FROM_EMAIL
        sync: false
      - key: MAILGUN_API_BASE_URL
        sync: false
      - key: MAILGUN_TIMEOUT
        sync: false
